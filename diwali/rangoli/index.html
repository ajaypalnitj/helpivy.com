<div class="sparkle" aria-hidden="true"></div>
<main class="dw-main max-w-4xl mx-auto px-4 pt-8">
<header class="text-center">
    <h1 class="dw-title text-4xl sm:text-5xl">Rangoli maker 🌸</h1>
    <p class="dw-muted mt-2">Draw anywhere on the circle. Everything you draw is copied all around, like a real rangoli.</p>
</header>
<div class="grid gap-6 md:grid-cols-[1fr_260px] mt-8 items-start">
    <canvas id="rg" width="1000" height="1000" class="w-full rounded-3xl shadow-2xl touch-none" aria-label="Rangoli drawing area"></canvas>
    <div class="dw-card space-y-4">
        <div><span class="font-semibold">Colour</span><div class="flex flex-wrap gap-2 mt-2" id="cols"></div></div>
        <div><span class="font-semibold">Brush</span><div class="flex gap-2 mt-2" id="sizes">
            <button class="dw-chip" data-s="6">Thin</button><button class="dw-chip is-on" data-s="14">Medium</button><button class="dw-chip" data-s="28">Thick</button></div></div>
        <div><span class="font-semibold">Petals</span><div class="flex gap-2 mt-2" id="syms">
            <button class="dw-chip" data-n="6">6</button><button class="dw-chip is-on" data-n="8">8</button><button class="dw-chip" data-n="12">12</button></div></div>
        <div class="flex flex-wrap gap-2 pt-2">
            <button id="undo" class="dw-btn dw-btn-alt">↩️ Undo</button>
            <button id="clear" class="dw-btn dw-btn-alt">🧽 Clear</button>
            <button id="save" class="dw-btn">⬇️ Save</button>
        </div>
    </div>
</div>
</main>
<script>

const cv = document.getElementById('rg'), ctx = cv.getContext('2d');
const COLS = ['#fde047', '#fb923c', '#f43f5e', '#ec4899', '#a855f7', '#22d3ee', '#4ade80', '#ffffff'];
let col = COLS[0], size = 14, n = 8, strokes = [], cur = null;
const C = 500;
document.getElementById('cols').innerHTML = COLS.map((c, i) => `<button aria-label="colour ${i + 1}" data-c="${c}" style="background:${c};width:34px;height:34px;border-radius:50%;border:3px solid ${i ? 'transparent' : '#fff'}"></button>`).join('');
function base() {
  const g = ctx.createRadialGradient(C, C, 50, C, C, 520); g.addColorStop(0, '#7c2d12'); g.addColorStop(1, '#431407');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1000, 1000);
  ctx.strokeStyle = 'rgba(253,230,138,.25)'; ctx.lineWidth = 2;
  for (const r of [120, 240, 360, 470]) { ctx.beginPath(); ctx.arc(C, C, r, 0, 2 * Math.PI); ctx.stroke(); }
}
function line(s, a, b) {
  for (let k = 0; k < s.n; k++) for (const m of [1, -1]) {
    ctx.save(); ctx.translate(C, C); ctx.rotate(k * 2 * Math.PI / s.n); ctx.scale(1, m);
    ctx.strokeStyle = s.col; ctx.lineWidth = s.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - C, a[1] - C); ctx.lineTo(b[0] - C, b[1] - C); ctx.stroke(); ctx.restore();
  }
}
function redraw() { base(); for (const s of strokes) for (let i = 1; i < s.pts.length; i++) line(s, s.pts[i - 1], s.pts[i]); }
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 1000 / r.width, (e.clientY - r.top) * 1000 / r.height]; }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const p = pos(e); cur = {col, size, n, pts: [p, [p[0] + .1, p[1]]]}; strokes.push(cur); line(cur, p, cur.pts[1]); });
cv.addEventListener('pointermove', e => { if (!cur) return; const p = pos(e), last = cur.pts[cur.pts.length - 1]; cur.pts.push(p); line(cur, last, p); });
const up = () => { cur = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
function pick(id, attr, fn) { document.getElementById(id).addEventListener('click', e => { const b = e.target.closest(`[${attr}]`); if (!b) return; fn(b); document.querySelectorAll(`#${id} [${attr}]`).forEach(x => x.classList.toggle('is-on', x === b)); }); }
document.getElementById('cols').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; col = b.dataset.c; document.querySelectorAll('#cols button').forEach(x => x.style.borderColor = x === b ? '#fff' : 'transparent'); });
pick('sizes', 'data-s', b => size = +b.dataset.s);
pick('syms', 'data-n', b => n = +b.dataset.n);
document.getElementById('undo').onclick = () => { strokes.pop(); redraw(); };
document.getElementById('clear').onclick = () => { strokes = []; redraw(); };
document.getElementById('save').onclick = () => {
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = "600 26px 'Poppins', sans-serif"; ctx.textAlign = 'center'; ctx.fillText('helpivy.com/diwali', C, 975);
  cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'my-rangoli.png'; a.click(); redraw(); });
};
redraw();

</script>

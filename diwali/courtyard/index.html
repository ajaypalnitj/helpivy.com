<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- assets
// Inlined as data URIs (window.ASSETS) when published, plain files when local.
const A = window.ASSETS;
const src = (n) => A ? A[n] : `assets/${n}`;
async function bytes(n) {
  if (A) return Uint8Array.from(atob(A[n].split(',')[1]), c => c.charCodeAt(0)).buffer;
  return (await fetch(`assets/${n}`)).arrayBuffer();
}
const img = (n) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src(n); });

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: !!window.__shots });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
const scene = new THREE.Scene();
const FOG = new THREE.Color(0x0a0a16);
scene.background = FOG.clone();
scene.fog = new THREE.FogExp2(FOG, 0.05);
const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 200);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const ao = new GTAOPass(scene, camera);
ao.updateGtaoMaterial({ radius: 0.22, distanceExponent: 1.6, thickness: 0.8, scale: 1.0, samples: 12 });
ao.blendIntensity = 0.9;
{ // keep flames, glows and the sky out of the AO depth/normal pass
  const ov = ao.overrideVisibility.bind(ao);
  ao.overrideVisibility = function () { ov(); scene.traverse(o => { if (o.userData.noAO) o.visible = false; }); };
}
composer.addPass(ao);
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.62, 0.55, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function tex(image, srgb, rx = 1, ry = rx) {
  const t = new THREE.Texture(image); t.needsUpdate = true;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
function canvasTex(c, srgb = true) {
  const t = new THREE.CanvasTexture(c); t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t;
}
// deterministic randomness so every visit looks the same
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

// ---------------------------------------------------------------- layout
const N_DIYA = 8, RING = 1.2, DIYA_S = 1.45, RANGOLI_R = 1.12;

// ---------------------------------------------------------------- rangoli
// Drawn as flat shapes, then "powdered": every pixel samples a jittered
// neighbour (grainy edges), brightness grain, and a bump map from coverage.
function rangoli() {
  const N = 2048, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'), C = N / 2, R = N / 2 * 0.985, TAU = Math.PI * 2;
  const P = (r, a) => [C + Math.cos(a) * r * R, C + Math.sin(a) * r * R];
  const W = '#f7f1e3';
  const disc = (r, col) => { g.beginPath(); g.arc(C, C, r * R, 0, TAU); g.fillStyle = col; g.fill(); };
  const at = (r, a, rad, col) => { const [x, y] = P(r, a); g.beginPath(); g.arc(x, y, rad * R, 0, TAU); g.fillStyle = col; g.fill(); };
  const line = (r, w, col) => { g.beginPath(); g.arc(C, C, r * R, 0, TAU); g.lineWidth = w; g.strokeStyle = col; g.stroke(); };
  const dots = (r, n, rad, col, ph = 0) => { for (let i = 0; i < n; i++) at(r, ph + i * TAU / n, rad, col); };
  function petal(r0, r1, a, wa, col, round = 0.62) {
    const rm0 = r0 + (r1 - r0) * 0.28, rm1 = r0 + (r1 - r0) * round;
    g.beginPath(); g.moveTo(...P(r0, a));
    g.bezierCurveTo(...P(rm0, a + wa), ...P(rm1, a + wa * 1.05), ...P(r1, a));
    g.bezierCurveTo(...P(rm1, a - wa * 1.05), ...P(rm0, a - wa), ...P(r0, a));
    g.fillStyle = col; g.fill();
  }
  // layered petal: white outline, colour, inner colour, centre vein
  function lpetal(r0, r1, a, wa, c1, c2, c3) {
    petal(r0 - 0.012, r1 + 0.016, a, wa + 0.03, W);
    petal(r0, r1, a, wa, c1);
    if (c2) petal(r0 + (r1 - r0) * 0.18, r1 - (r1 - r0) * 0.16, a, wa * 0.55, c2);
    if (c3) petal(r0 + (r1 - r0) * 0.3, r1 - (r1 - r0) * 0.3, a, wa * 0.14, c3);
  }
  const col = { mag: '#d4145a', pink: '#ff6fa9', org: '#ff6d00', mari: '#ffa000', yel: '#ffd21f', grn: '#16a34a', leaf: '#86d33f', tq: '#00a5b8', ind: '#24319a', vio: '#6b2fc4', red: '#d3201a', sky: '#38b6ff' };

  // outer scalloped border
  for (let i = 0; i < 40; i++) at(0.93, i * TAU / 40, 0.07, W);
  disc(0.935, W);
  for (let i = 0; i < 40; i++) at(0.93, i * TAU / 40, 0.058, col.org);
  disc(0.925, col.org);
  dots(0.955, 40, 0.017, col.yel);
  dots(0.955, 40, 0.007, W);
  line(0.875, 7, W);
  disc(0.87, col.mag);
  dots(0.83, 64, 0.0095, W, 0.04);
  for (let i = 0; i < 32; i++) lpetal(0.79, 0.865, i * TAU / 32 + TAU / 64, 0.05, col.yel, null, null);
  line(0.795, 7, W);
  disc(0.79, col.ind);
  // big petals and leaves
  for (let i = 0; i < 8; i++) {
    const a = i * TAU / 8;
    lpetal(0.35, 0.76, a, 0.26, col.mag, col.pink, col.yel);
    at(0.69, a, 0.022, W); at(0.69, a, 0.012, col.yel);
    const b = a + TAU / 16;
    lpetal(0.42, 0.66, b, 0.14, col.grn, col.leaf, null);
    at(0.715, b, 0.018, col.tq); at(0.715, b, 0.009, W);
    at(0.75, b - 0.06, 0.008, W); at(0.75, b + 0.06, 0.008, W);
  }
  dots(0.385, 32, 0.008, W, TAU / 64);
  line(0.36, 7, W);
  disc(0.355, col.yel);
  for (let i = 0; i < 16; i++) lpetal(0.24, 0.35, i * TAU / 16, 0.13, col.org, col.mari, null);
  line(0.245, 7, W);
  disc(0.24, col.red);
  for (let i = 0; i < 8; i++) lpetal(0.06, 0.235, i * TAU / 8 + TAU / 16, 0.36, '#ff8fbf', W, null);
  for (let i = 0; i < 8; i++) lpetal(0.05, 0.19, i * TAU / 8, 0.3, col.mag, col.pink, null);
  disc(0.085, W); disc(0.075, col.yel); disc(0.04, col.org); disc(0.016, col.red);
  dots(0.058, 12, 0.006, col.red);

  // ---- powder pass
  const src = g.getImageData(0, 0, N, N), s = src.data;
  const out = g.createImageData(N, N), o = out.data;
  const bc = document.createElement('canvas'); bc.width = bc.height = 1024;
  const bg = bc.getContext('2d'), bump = bg.createImageData(1024, 1024), b = bump.data;
  // low-frequency smudge noise
  const LN = 64, low = new Float32Array(LN * LN); for (let i = 0; i < low.length; i++) low[i] = rnd();
  const lowAt = (x, y) => {
    const fx = x / N * (LN - 1), fy = y / N * (LN - 1), ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy;
    const a = low[iy * LN + ix], b2 = low[iy * LN + ix + 1], c2 = low[(iy + 1) * LN + ix], d = low[(iy + 1) * LN + ix + 1];
    return (a * (1 - tx) + b2 * tx) * (1 - ty) + (c2 * (1 - tx) + d * tx) * ty;
  };
  let h = 1234567;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    h = (h * 1103515245 + 12345) & 0x7fffffff;
    const jx = ((h & 7) - 3.5) * 0.9, jy = (((h >> 3) & 7) - 3.5) * 0.9;
    const sx = Math.min(N - 1, Math.max(0, x + jx | 0)), sy = Math.min(N - 1, Math.max(0, y + jy | 0));
    const si = (sy * N + sx) * 4, oi = (y * N + x) * 4;
    const grain = ((h >> 6) & 255) / 255;
    const k = 0.84 + 0.2 * grain + 0.1 * (lowAt(x, y) - 0.5);
    o[oi] = Math.min(255, s[si] * k); o[oi + 1] = Math.min(255, s[si + 1] * k); o[oi + 2] = Math.min(255, s[si + 2] * k);
    // powder is thinner near shape edges: sparse speckles where coverage starts
    o[oi + 3] = s[si + 3] > 0 && (s[si + 3] === 255 || grain > 0.45) ? 255 : 0;
    if ((x & 1) === 0 && (y & 1) === 0) {
      const bi = ((y >> 1) * 1024 + (x >> 1)) * 4, v = o[oi + 3] ? 150 + grain * 105 : 0;
      b[bi] = b[bi + 1] = b[bi + 2] = v; b[bi + 3] = 255;
    }
  }
  g.putImageData(out, 0, 0); bg.putImageData(bump, 0, 0);
  return { map: canvasTex(c), bump: canvasTex(bc, false) };
}

// ---------------------------------------------------------------- diya paint
// Painted UV layout (from diya.py): v 0-.08 underside, .08-.5 outer wall,
// .5-.62 rim, .62-1 inside. glTF flips v, so canvas y = (1 - v) * H.
function diyaPaint(clay, variant) {
  const Wd = 1024, H = 512, c = document.createElement('canvas'); c.width = Wd; c.height = H;
  const r = document.createElement('canvas'); r.width = Wd; r.height = H;
  const g = c.getContext('2d'), gr = r.getContext('2d');
  const Y = v => (1 - v) * H;
  // terracotta body: scanned clay, warmed and multiplied
  g.filter = 'contrast(1.35) saturate(1.2)';
  for (let i = 0; i < 4; i++) g.drawImage(clay, i * Wd / 4, 0, Wd / 4, H);
  g.filter = 'none';
  g.globalCompositeOperation = 'multiply'; g.fillStyle = '#e07a45'; g.fillRect(0, 0, Wd, H);
  g.globalCompositeOperation = 'source-over';
  gr.fillStyle = '#d0d0d0'; gr.fillRect(0, 0, Wd, H);
  // inside: oil-soaked, darker and glossier
  const ins = g.createLinearGradient(0, Y(0.62), 0, Y(1));
  ins.addColorStop(0, 'rgba(70,25,8,.35)'); ins.addColorStop(0.25, 'rgba(60,22,6,.6)'); ins.addColorStop(1, 'rgba(50,18,5,.7)');
  g.fillStyle = ins; g.fillRect(0, Y(1), Wd, Y(0.62) - Y(1));
  gr.fillStyle = '#6a6a6a'; gr.fillRect(0, Y(1), Wd, Y(0.64) - Y(1));
  // underside slightly sooty
  g.fillStyle = 'rgba(40,20,10,.35)'; g.fillRect(0, Y(0.08), Wd, H - Y(0.08));

  const paint = (col, rough = '#7a7a7a') => { g.fillStyle = col; gr.fillStyle = rough; };
  const band = (v0, v1, col, rough) => { paint(col, rough); g.fillRect(0, Y(v1), Wd, Y(v0) - Y(v1)); gr.fillRect(0, Y(v1), Wd, Y(v0) - Y(v1)); };
  const dot = (u, v, rad, col) => { for (const [ctx, cc] of [[g, col], [gr, '#707070']]) { ctx.beginPath(); ctx.ellipse(u * Wd, Y(v), rad, rad * 1.25, 0, 0, Math.PI * 2); ctx.fillStyle = cc; ctx.fill(); } };
  const wave = (v, amp, n, w, col) => {
    for (const [ctx, cc] of [[g, col], [gr, '#707070']]) {
      ctx.beginPath();
      for (let i = 0; i <= 400; i++) { const u = i / 400; const y = Y(v) + Math.sin(u * n * Math.PI * 2) * amp; i ? ctx.lineTo(u * Wd, y) : ctx.moveTo(u * Wd, y); }
      ctx.lineWidth = w; ctx.strokeStyle = cc; ctx.stroke();
    }
  };
  const leaf = (u, v, len, col) => {
    for (const [ctx, cc] of [[g, col], [gr, '#707070']]) {
      const x = u * Wd, y = Y(v);
      ctx.beginPath(); ctx.moveTo(x, y + len * 0.5);
      ctx.quadraticCurveTo(x + len * 0.42, y, x, y - len * 0.5);
      ctx.quadraticCurveTo(x - len * 0.42, y, x, y + len * 0.5);
      ctx.fillStyle = cc; ctx.fill();
    }
  };
  const P = [
    { rim: '#b3121b', band: '#b3121b', dots: '#fff3d6', wave: '#ffc21a', leaf: '#ffd34d', body: null },
    { rim: '#ffbf1f', band: '#1f7a3c', dots: '#fff3d6', wave: '#ffbf1f', leaf: '#ff4f7a', body: null },
    { rim: '#ffbf1f', band: '#7a1fa0', dots: '#ffe08a', wave: '#fff3d6', leaf: '#ffbf1f', body: '#9e1a14' },
  ][variant];
  if (P.body) band(0.14, 0.5, P.body, '#8a8a8a');
  band(0.5, 0.62, P.rim, '#606060');            // painted rolled rim
  band(0.405, 0.47, P.band, '#6a6a6a');         // collar band below the rim
  for (let i = 0; i < 48; i++) dot((i + 0.5) / 48, 0.437, 3.2, P.dots);
  wave(0.36, 6, 16, 5, P.wave);
  for (let i = 0; i < 16; i++) { leaf((i + 0.5) / 16, 0.27, 34, P.leaf); dot((i + 0.5) / 16, 0.2, 3.5, P.dots); dot(i / 16, 0.31, 3, P.dots); }
  band(0.15, 0.17, P.band, '#6a6a6a');
  // painted spout tip (u 0.5 is the spout) – a little extra colour where hands hold it
  return { map: canvasTex(c), rough: canvasTex(r, false) };
}

// ---------------------------------------------------------------- flames
const flameVS = `
uniform float uTime, uSeed, uLit, uW, uH;
varying vec2 vP; varying float vF;
float n1(float x){ return sin(x)*0.5 + sin(x*2.31+1.3)*0.3 + sin(x*5.17+4.1)*0.2; }
void main(){
  vec4 mv = modelViewMatrix * vec4(0.,0.,0.,1.);
  float t = uTime + uSeed*17.;
  float fl = n1(t*7.0);
  float hgt = uH * uLit * (0.92 + 0.08*fl);
  float sway = n1(t*3.1 + 2.0) * 0.18 * position.y * position.y;
  mv.xy += vec2((position.x + sway) * uW * (0.85 + 0.15*uLit), position.y * hgt);
  vP = position.xy; vF = fl;
  gl_Position = projectionMatrix * mv;
}`;
const flameFS = `
uniform float uLit, uI;
varying vec2 vP; varying float vF;
void main(){
  float y = vP.y, x = vP.x;
  float w = y < 0.3 ? 0.36*sqrt(max(0., 1. - pow((0.3-y)/0.3, 2.))) : 0.36*pow(max(0., 1. - (y-0.3)/0.7), 1.3);
  float d = abs(x) / max(w, 1e-3);
  float a = smoothstep(1.0, 0.45, d);
  float core = smoothstep(0.8, 0.0, d) * smoothstep(0.75, 0.18, y) * smoothstep(0.0, 0.12, y);
  vec3 outer = vec3(1.0, 0.36, 0.06), mid = vec3(1.0, 0.72, 0.28), hot = vec3(1.0, 0.96, 0.84);

  return geo;
}

  scene.environment = pm.fromEquirectangular(env).texture; scene.environmentIntensity = 0.22;

  // floor: red sandstone pavers
  const FS = 40, rep = FS / 2.15;
  const floorMat = new THREE.MeshStandardMaterial({ map: tex(flD, true, rep), normalMap: tex(flN, false, rep), roughnessMap: tex(flR, false, rep), color: 0xc9a08a, roughness: 0.92, normalScale: new THREE.Vector2(0.9, 0.9) });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(FS, FS), floorMat);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  // rangoli
  const rg = rangoli();
  const rm = new THREE.MeshStandardMaterial({ map: rg.map, bumpMap: rg.bump, bumpScale: 1.6, roughness: 0.97, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
  const rang = new THREE.Mesh(new THREE.PlaneGeometry(RANGOLI_R * 2, RANGOLI_R * 2), rm);
  rang.rotation.x = -Math.PI / 2; rang.position.y = 0.0015; rang.receiveShadow = true; rang.renderOrder = 1; scene.add(rang);

  // low sandstone parapet on three sides of the courtyard
  const wallMat = new THREE.MeshStandardMaterial({ map: tex(flD, true), normalMap: tex(flN, false), roughnessMap: tex(flR, false), color: 0xd9b49a });
  const capMat = new THREE.MeshStandardMaterial({ map: tex(flD, true), normalMap: tex(flN, false), color: 0xe8cdb6, roughness: 0.7 });
  const walls = [[0, -4.6, 11, 0], [-5.5, -0.8, 7.6, Math.PI / 2], [5.5, -0.8, 7.6, Math.PI / 2]];
  const wallTops = [];
  for (const [x, z, len, ry] of walls) {
    const body = new THREE.Mesh(boxUV(new THREE.BoxGeometry(len, 0.8, 0.36), len, 0.8, 0.36, 1.6), wallMat);
    const cap = new THREE.Mesh(boxUV(new THREE.BoxGeometry(len + 0.12, 0.08, 0.5), len + 0.12, 0.08, 0.5, 1.6), capMat);
    body.position.set(x, 0.4, z); cap.position.set(x, 0.84, z); body.rotation.y = cap.rotation.y = ry;
    for (const m of [body, cap]) { m.castShadow = m.receiveShadow = true; scene.add(m); }
    wallTops.push({ x, z, len, ry });
  }

  // diyas
  const gltf = await new GLTFLoader().parseAsync(await bytes('diya.glb'), '');
  const parts = {}; let anchor = new THREE.Vector3();
  gltf.scene.traverse(o => { if (o.isMesh) parts[o.material.name] = o.geometry; if (o.name === 'FlameAnchor') anchor = o.position.clone(); });
  const clayN = tex(clN, false, 4, 1);
  const paints = [0, 1, 2].map(v => diyaPaint(clD, v));
  const bodyMats = paints.map(p => new THREE.MeshPhysicalMaterial({ map: p.map, roughnessMap: p.rough, normalMap: clayN, normalScale: new THREE.Vector2(0.55, 0.55), roughness: 1 }));
  const oilMat = new THREE.MeshPhysicalMaterial({ color: 0x5a3208, roughness: 0.28, clearcoat: 0.6, clearcoatRoughness: 0.2, ior: 1.47, specularIntensity: 0.7 });
  const wickMat = new THREE.MeshStandardMaterial({ color: 0xb59a74, roughness: 1 });
  const charMat = new THREE.MeshStandardMaterial({ color: 0x17110d, roughness: 0.9 });
  const mats = { oil: oilMat, wick: wickMat, char: charMat };
  // soft contact shadow under each diya
  const shc = document.createElement('canvas'); shc.width = shc.height = 128; { const g = shc.getContext('2d'); const gr = g.createRadialGradient(64, 64, 8, 64, 64, 64); gr.addColorStop(0, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
  const shMat = new THREE.MeshBasicMaterial({ map: canvasTex(shc), transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 });

  for (let i = 0; i < N_DIYA; i++) {
    const a = i / N_DIYA * Math.PI * 2 + Math.PI / 2 + Math.PI / N_DIYA;
    const grp = new THREE.Group();
    for (const [k, geo] of Object.entries(parts)) {
      const m = new THREE.Mesh(geo, k === 'terracotta' ? bodyMats[i % 3] : mats[k]);
      m.castShadow = true; m.receiveShadow = true; grp.add(m);
    }
    const s = DIYA_S * (0.97 + rnd() * 0.06);
    grp.scale.setScalar(s);
    grp.position.set(Math.cos(a) * RING, 0, Math.sin(a) * RING);
    grp.rotation.y = -a + (rnd() - 0.5) * 0.25;       // spout points outward
    scene.add(grp);
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.42), shMat); sh.rotation.x = -Math.PI / 2; sh.position.set(grp.position.x, 0.003, grp.position.z); sh.renderOrder = 2; scene.add(sh);
    grp.updateMatrixWorld(true);
    const wp = anchor.clone().applyMatrix4(grp.matrixWorld);
    const fl = makeFlame(wp, i);
    const light = new THREE.PointLight(0xff9038, 0, 0, 2); light.position.copy(wp).add(new THREE.Vector3(0, 0.17, 0));
    scene.add(light);
    st.diyas.push({ grp, wp, fl, light, lit: false, k: 0, pop: 0, i });
  }

  // tiny diyas along the parapet (instanced), lit in a cascade at the end
  parapet = (() => {
    const spots = [];
    for (const w of wallTops) {
      const n = Math.round(w.len / 0.85);
      for (let k = 0; k < n; k++) {
        const u = (k + 0.5) / n - 0.5;
        const dx = w.ry ? 0 : u * w.len, dz = w.ry ? u * w.len : 0;
        spots.push(new THREE.Vector3(w.x + dx, 0.88, w.z + dz));
      }
    }
    const S = 0.85, inst = {};
    for (const [k, geo] of Object.entries(parts)) {
      const im = new THREE.InstancedMesh(geo, k === 'terracotta' ? bodyMats[0] : mats[k], spots.length);
      const o = new THREE.Object3D();
      spots.forEach((p, i) => { o.position.copy(p); o.rotation.y = Math.atan2(p.z - 0, -(p.x)) + Math.PI; o.scale.setScalar(S); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
      im.castShadow = true; scene.add(im); inst[k] = im;
    }
    const o = new THREE.Object3D();
    const tips = spots.map((p, i) => { o.position.copy(p); o.rotation.y = Math.atan2(p.z, -p.x) + Math.PI; o.scale.setScalar(S); o.updateMatrix(); return anchor.clone().applyMatrix4(o.matrix); });
    // flames as points (small on screen, excluded from AO automatically)
    const g = new THREE.BufferGeometry(); const pos = new Float32Array(tips.length * 3), del = new Float32Array(tips.length);
    tips.forEach((p, i) => { pos.set([p.x, p.y + 0.05, p.z], i * 3); del[i] = Math.hypot(p.x, p.z + 4.6) * 0.075; });
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aDelay', new THREE.BufferAttribute(del, 1));
    const m = new THREE.ShaderMaterial({ ...additive, uniforms: { uScale: pMat.uniforms.uScale, uT: { value: 0 }, uStart: { value: 1e9 } },
      vertexShader: `attribute float aDelay; uniform float uScale, uT, uStart; varying float vL; varying float vF;
        void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * mv;
          float lit = clamp((uT - uStart - aDelay) / 0.4, 0., 1.); vL = lit;
          vF = 0.9 + 0.1*sin(uT*9. + position.x*13.); gl_PointSize = 0.42 * uScale / -mv.z * lit; }`,
      fragmentShader: `varying float vL; varying float vF;
        void main(){ vec2 q = gl_PointCoord*2.-1.; q.y = -q.y; float y = (q.y+1.)*.5;
          float w = y < 0.3 ? 0.36*sqrt(max(0., 1. - pow((0.3-y)/0.3, 2.))) : 0.36*pow(max(0., 1. - (y-0.3)/0.7), 1.3);
          float d = abs(q.x*1.6) / max(w, 1e-3); float a = smoothstep(1., 0.4, d);
          vec3 c = mix(vec3(1.,.4,.08), vec3(1.,.93,.75), smoothstep(.9,.0,d)*smoothstep(.8,.2,y));
          float halo = exp(-dot(q,q)*3.) * 0.18;
          gl_FragColor = vec4((c*a*3.0 + vec3(1.,.55,.2)*halo) * vF * min(vL,1.), 1.); }` });
    const pts = new THREE.Points(g, m); pts.frustumCulled = false; scene.add(pts);
    const lights = [new THREE.PointLight(0xff9a48, 0, 0, 2), new THREE.PointLight(0xff9a48, 0, 0, 2), new THREE.PointLight(0xff9a48, 0, 0, 2)];
    lights[0].position.set(0, 1.2, -4.2); lights[1].position.set(-5.1, 1.2, -1); lights[2].position.set(5.1, 1.2, -1);
    lights.forEach(l => scene.add(l));
    let t0 = -1;
    return {
      start(t) { t0 = t; m.uniforms.uStart.value = t; }, stop() { t0 = -1; m.uniforms.uStart.value = 1e9; lights.forEach(l => l.intensity = 0); },
      update(t) {
        m.uniforms.uT.value = t;
        if (t0 < 0) return;
        lights.forEach(l => l.intensity = 2.2 * THREE.MathUtils.clamp((t - t0) / 1.2, 0, 1));
      },
    };
  })();

  // lights
  moon.position.set(-3.5, 7, -4.5); moon.target.position.set(0, 0, 0.3);
  moon.castShadow = true; moon.shadow.mapSize.set(1024, 1024); moon.shadow.bias = -0.0004; moon.shadow.normalBias = 0.02; moon.shadow.radius = 5;
  Object.assign(moon.shadow.camera, { left: -6.5, right: 6.5, top: 6.5, bottom: -6.5, near: 1, far: 20 });
  bounce.position.set(0, 1.6, 0.2);
  scene.add(moon, moon.target, hemi, bounce);

  skyM = sky(); skyline(); petal = petals();
  buildDots();
  resize(); addEventListener('resize', resize);
  renderer.compile(scene, camera);
  const ld = document.getElementById('load'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 900);
  window.__ready = true; window.__scene = scene;
  renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 1 / 20); frame(dt, clock.elapsedTime + tOff); composer.render(); });
}

// ---------------------------------------------------------------- camera
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const camA = { pos: V(), look: V(), fov: 36 }, camB = { pos: V(), look: V(), fov: 46 };
function fit() {
  const asp = innerWidth / innerHeight, portrait = asp < 0.9;
  // start: elevated view of the rangoli; sized so the ring fits the width
  const fov = portrait ? 50 : 36; camera.fov = fov;
  const hHalf = Math.atan(Math.tan(THREE.MathUtils.degToRad(fov / 2)) * asp);
  const need = portrait ? 1.52 : 1.75;
  const d = Math.max(need / Math.tan(hHalf), portrait ? 0 : 4.4);
  const pitch = THREE.MathUtils.degToRad(portrait ? 64 : 44);
  camA.look.set(0, 0, portrait ? 0.12 : 0.2);
  camA.pos.set(0, Math.sin(pitch) * d, Math.cos(pitch) * d).add(camA.look);
  camA.fov = fov;
  // celebration: drop down and tilt up so the sky over the parapet opens up
  camB.fov = portrait ? 64 : 46;
  const hB = Math.atan(Math.tan(THREE.MathUtils.degToRad(camB.fov / 2)) * asp);
  const dB = portrait ? 1.5 / Math.tan(hB) + 0.3 : Math.max(4.3, 1.7 / Math.tan(hB) + 0.9);
  camB.pos.set(0, portrait ? 1.9 : 1.45, dB);
  camB.look.set(0, portrait ? 1.2 : 0.8, -3);
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  bloom.resolution.set(w / 2, h / 2);
  camera.aspect = w / h; fit(); setFov(camera.fov);
}
function setFov(f) {
  camera.fov = f; camera.updateProjectionMatrix();
  pMat.uniforms.uScale.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(f / 2)));
}
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const _p = V(), _l = V();
function placeCamera(dt, t) {
  st.camK += (st.camTo - st.camK) * Math.min(1, dt * 0.55);
  const k = ease(THREE.MathUtils.clamp(st.camK, 0, 1));
  _p.lerpVectors(camA.pos, camB.pos, k); _l.lerpVectors(camA.look, camB.look, k);
  const fv = camA.fov + (camB.fov - camA.fov) * k; if (Math.abs(fv - camera.fov) > 1e-3) setFov(fv);
  st.az += (st.azT - st.az) * Math.min(1, dt * 6);
  // a gentle breathing drift plus the user's drag (orbit around the rangoli)
  const az = st.az + Math.sin(t * 0.21) * 0.025;
  const x = _p.x * Math.cos(az) + _p.z * Math.sin(az), z = -_p.x * Math.sin(az) + _p.z * Math.cos(az);
  camera.position.set(x, _p.y + Math.sin(t * 0.33) * 0.02, z);
  camera.lookAt(_l);
}

// ---------------------------------------------------------------- interaction
const dotsEl = document.getElementById('dots'), hint = document.getElementById('hint'), act = document.getElementById('act'), cele = document.getElementById('cele');
function buildDots() { dotsEl.innerHTML = '<i></i>'.repeat(N_DIYA); }
function setDots() { [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i < st.lit)); }
const _v = V();
function screenOf(p) { _v.copy(p).project(camera); return [(_v.x + 1) / 2 * innerWidth, (1 - _v.y) / 2 * innerHeight]; }
function pick(x, y) {
  const R = Math.max(54, Math.min(innerWidth, innerHeight) * 0.085);
  let best = null, bd = 1e9;
  for (const d of st.diyas) {
    const c = d.wp.clone(); c.y = 0.08;                            // aim at the bowl, not just the wick
    const [sx, sy] = screenOf(c), dd = Math.hypot(sx - x, sy - y) - (d.lit ? 14 : 0);
    if (dd < bd) { bd = dd; best = d; }
  }
  return bd < R ? best : null;
}
function lightDiya(d) {
  if (d.lit) { d.pop = 1; sfx.tinkle(); for (let k = 0; k < 14; k++) spawn(d.wp.x, d.wp.y + 0.08, d.wp.z, (rnd() - .5) * .5, rnd() * .9, (rnd() - .5) * .5, FW_COLS[6], 0.02, 0.7, 2.5, 0.8); return; }
  d.lit = true; d.pop = 1; st.lit++;
  sfx.light(st.lit - 1);
  for (let k = 0; k < 36; k++) { const a = rnd() * 6.28, s = 0.3 + rnd() * 0.6; spawn(d.wp.x, d.wp.y + 0.04, d.wp.z, Math.cos(a) * s, 0.4 + rnd() * 1.0, Math.sin(a) * s, FW_COLS[rnd() < .5 ? 6 : 0], 0.022, 0.6 + rnd() * 0.5, 2.6, 1.2); }
  setDots();
  const left = N_DIYA - st.lit;
  hint.innerHTML = left ? (left === 1 ? 'Just <b>one more</b>!' : `<b>${left}</b> more to light`) : '';
  if (!left) st.pending = 0.7;
}
function celebrate() {
  st.celebrating = true; st.celeT = 0; st.camTo = 1; st.nextFw = 1.2; st.fwBurst = 0;
  parapet.start(clock2.t + 0.4); sfx.chord(); st.cues = 0;
  hint.style.opacity = 0; document.querySelector('.top').style.opacity = 0;
}
function reset() {
  st.celebrating = false; st.pending = 0; st.camTo = 0; st.lit = 0; setDots();
  st.diyas.forEach(d => { d.lit = false; });
  parapet.stop(); petal.clear();
  cele.classList.remove('show'); act.classList.remove('show');
  hint.innerHTML = 'Tap a <b>diya</b> to light it'; hint.style.opacity = 1; document.querySelector('.top').style.opacity = 1;
}
document.getElementById('again').onclick = (e) => { e.stopPropagation(); reset(); };
let down = null;
canvas.addEventListener('pointerdown', e => { sfx.init(); down = { x: e.clientX, y: e.clientY, az: st.azT, moved: false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - down.x;
  if (Math.abs(dx) > 10 || Math.abs(e.clientY - down.y) > 10) down.moved = true;
  if (down.moved) st.azT = THREE.MathUtils.clamp(down.az - dx / innerWidth * 1.6, -0.6, 0.6);
});
canvas.addEventListener('pointerup', e => {
  if (!down) return; const moved = down.moved; down = null;
  if (moved) return;
  const d = pick(e.clientX, e.clientY);
  if (d) return lightDiya(d);
  if (st.celebrating) {           // tap the sky: a firework goes up there
    const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
    const tz = -9.5, k = (tz - ray.ray.origin.z) / ray.ray.direction.z;
    if (k > 0) { const p = ray.ray.at(k, V()); p.y = THREE.MathUtils.clamp(p.y, 2.6, 7); p.x = THREE.MathUtils.clamp(p.x, -9, 9); launch(p); }
  }
});

// ---------------------------------------------------------------- frame
const clock = new THREE.Clock(); let tOff = 0; const clockT = () => clock.getElapsedTime();
const clock2 = { t: 0 };
const warmHemi = new THREE.Color(0x8a5a3a), coolHemi = new THREE.Color(0x46507a), _c = new THREE.Color();
function frame(dt, t) {
  clock2.t = t;
  // diyas
  let litK = 0;
  for (const d of st.diyas) {
    d.k += ((d.lit ? 1 : 0) - d.k) * Math.min(1, dt * (d.lit ? 3.2 : 2));
    d.pop = Math.max(0, d.pop - dt * 1.6);
    const pop = 1 + Math.sin((1 - d.pop) * Math.PI) * d.pop * 0.35;
    const flick = 0.88 + 0.07 * Math.sin(t * 11 + d.i * 3) + 0.05 * Math.sin(t * 23.3 + d.i);
    d.fl.m.uniforms.uTime.value = t; d.fl.m.uniforms.uLit.value = d.k * pop;
    // unlit diyas breathe a faint ember glow: "tap me"
    const ember = d.lit ? 0 : (0.5 + 0.35 * Math.sin(t * 2.4 + d.i * 0.8));
    d.fl.gm.uniforms.uA.value = d.k * 0.55 * flick + ember * (1 - d.k);
    d.fl.gm.uniforms.uS.value = 0.14 + d.k * 0.5;
    d.light.intensity = d.k * 1.7 * flick * pop;
    litK += d.k;
  }
  const f = litK / N_DIYA;
  st.warm += (f - st.warm) * Math.min(1, dt * 1.5);
  const w = st.warm;
  moon.intensity = 1.15 * (1 - 0.6 * w);
  hemi.color.copy(coolHemi).lerp(warmHemi, w); hemi.intensity = 0.85 - 0.1 * w;
  bounce.intensity = 1.6 * w * w;
  scene.environmentIntensity = 0.22 + 0.12 * w;
  renderer.toneMappingExposure = 1.0 + 0.1 * w;
  skyM.uniforms.uT.value = t; skyM.uniforms.uWarm.value = st.celebrating ? Math.min(1, st.celeT / 3) : 0;
  // fireworks
  if (st.pending > 0 && (st.pending -= dt) <= 0) celebrate();
  if (st.celebrating) {
    st.celeT += dt;
    if (st.cues === 0 && st.celeT > 1.6) { st.cues++; petal.start(); }
    if (st.cues === 1 && st.celeT > 2.4) { st.cues++; cele.classList.add('show'); }
    if (st.cues === 2 && st.celeT > 5.2) { st.cues++; act.classList.add('show'); }
    if (st.celeT > st.nextFw) {
      launch(); if (st.celeT < 12 && rnd() < 0.5) launch();
      st.nextFw = st.celeT + (st.celeT < 12 ? 0.55 + rnd() * 0.6 : 1.6 + rnd() * 1.8);
    }
  }
  stepRockets(dt); stepParticles(dt, t);
  skyFlash = Math.max(0, skyFlash - dt * 2.2);
  _c.copy(flashCol).multiplyScalar(skyFlash * 0.5);
  hemi.color.add(_c);
  parapet.update(t); petal.update(dt, t);
  placeCamera(dt, t);
}

// debug hooks for screenshots
window.__light = (n) => { for (const d of st.diyas) { if (n <= 0) break; if (!d.lit) { lightDiya(d); n--; } } };
window.__burst = () => { for (let i = 0; i < 4; i++) launch(); };
window.__step = (sec) => { for (let k = 0; k < sec * 30; k++) { tOff += 1 / 30; frame(1 / 30, clockT() + tOff); } };
main().catch(e => { console.error(e); document.querySelector('#load div').textContent = 'Could not load the courtyard. Please refresh.'; });
</script>
</body>

<script>

const COLS = ['#ef4444', '#f97316', '#facc15', '#fde68a', '#22c55e', '#14b8a6', '#3b82f6', '#a855f7', '#ec4899', '#92400e', '#ffffff', 'rainbow'];
let col = COLS[2], hue = 0;
const pal = document.getElementById('pal');
pal.innerHTML = COLS.map((c, i) => `<button aria-label="${c === 'rainbow' ? 'rainbow' : 'colour ' + (i + 1)}" data-c="${c}" style="background:${c === 'rainbow' ? 'conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)' : c}" class="${i === 2 ? 'is-on' : ''}"></button>`).join('');
pal.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; col = b.dataset.c; pal.querySelectorAll('button').forEach(x => x.classList.toggle('is-on', x === b)); FX.chime(3, .05); });
// Closed shapes can be filled; open lines (smiles, swirls) stay as lines.
document.querySelectorAll('.page svg').forEach(svg => {
  svg.querySelectorAll('circle, ellipse, path').forEach(el => {
    if (el.tagName === 'path' && !/z\s*$/i.test(el.getAttribute('d'))) return;
    el.classList.add('fillable'); el.setAttribute('fill', '#ffffff');
    el.addEventListener('click', e => {
      const c = col === 'rainbow' ? `hsl(${(hue += 37) % 360} 90% 60%)` : col;
      el.setAttribute('fill', c); FX.sparkle(e.clientX, e.clientY, 10); FX.chime(Math.floor(Math.random() * 8), .05);
    });
  });
});
document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => document.querySelectorAll(`[data-k="${b.dataset.reset}"] .fillable`).forEach(el => el.setAttribute('fill', '#ffffff')));
document.querySelectorAll('[data-save]').forEach(b => b.onclick = () => {
  const svg = document.querySelector(`[data-k="${b.dataset.save}"] svg`).cloneNode(true);
  svg.setAttribute('width', 1240); svg.setAttribute('height', 1754);
  const img = new Image(), url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], {type: 'image/svg+xml'}));
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = 1240; c.height = 1754; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0); URL.revokeObjectURL(url);
    c.toBlob(bl => { const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = `diwali-${b.dataset.save}.png`; a.click(); FX.show(4); });
  };
  img.src = url;
});

</script>
